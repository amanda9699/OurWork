spring:
  application:
    name: TeamWork
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息：默认连本机 bet_platform 库，
    # 队友可用环境变量 DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD 覆盖各自的本地配置
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bet_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

# 见证人邀请链接的前端页面地址（接口 3.4 拼 inviteUrl 用），部署时用环境变量 INVITE_BASE_URL 覆盖
invite:
  base-url: ${INVITE_BASE_URL:http://localhost:5173}
